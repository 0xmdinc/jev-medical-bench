<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Jev confidence gate, hard set"><title>Jev confidence gate, hard set</title><rect width="960" height="380" rx="12" fill="#fcfcfb"/><text x="24.0" y="34.0" fill="#0b0b0b" font-size="18" text-anchor="start" font-weight="700">Jev as a gate (hard set)</text><text x="24.0" y="56.0" fill="#898781" font-size="13" text-anchor="start" font-weight="400">Keep Jev&#x27;s answer when its confidence clears the threshold, escalate the rest to a reasoning model.</text><line x1="70" x2="830" y1="316.0" y2="316.0" stroke="#e1e0d9"/><text x="60.0" y="320.0" fill="#898781" font-size="12" text-anchor="end" font-weight="400">50%</text><line x1="70" x2="830" y1="272.0" y2="272.0" stroke="#e1e0d9"/><text x="60.0" y="276.0" fill="#898781" font-size="12" text-anchor="end" font-weight="400">60%</text><line x1="70" x2="830" y1="228.0" y2="228.0" stroke="#e1e0d9"/><text x="60.0" y="232.0" fill="#898781" font-size="12" text-anchor="end" font-weight="400">70%</text><line x1="70" x2="830" y1="184.0" y2="184.0" stroke="#e1e0d9"/><text x="60.0" y="188.0" fill="#898781" font-size="12" text-anchor="end" font-weight="400">80%</text><line x1="70" x2="830" y1="140.0" y2="140.0" stroke="#e1e0d9"/><text x="60.0" y="144.0" fill="#898781" font-size="12" text-anchor="end" font-weight="400">90%</text><line x1="70" x2="830" y1="96.0" y2="96.0" stroke="#e1e0d9"/><text x="60.0" y="100.0" fill="#898781" font-size="12" text-anchor="end" font-weight="400">100%</text><text x="100.0" y="340.0" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">keep all</text><text x="100.0" y="358.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">0 escalated</text><text x="270.0" y="340.0" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">conf ≥ 0.6</text><text x="270.0" y="358.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">4 escalated</text><text x="440.0" y="340.0" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">conf ≥ 0.7</text><text x="440.0" y="358.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">8 escalated</text><text x="610.0" y="340.0" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">conf ≥ 0.8</text><text x="610.0" y="358.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">14 escalated</text><text x="780.0" y="340.0" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">conf ≥ 0.9</text><text x="780.0" y="358.0" fill="#898781" font-size="12" text-anchor="middle" font-weight="400">22 escalated</text><path d="M100.0,138.3 L270.0,114.3 L440.0,116.0 L610.0,107.6 L780.0,96.0" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/><circle cx="100.0" cy="138.3" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Accuracy on kept answers, keep all: 90%</title></circle><circle cx="270.0" cy="114.3" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Accuracy on kept answers, conf >= 0.6: 96%</title></circle><circle cx="440.0" cy="116.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Accuracy on kept answers, conf >= 0.7: 95%</title></circle><circle cx="610.0" cy="107.6" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Accuracy on kept answers, conf >= 0.8: 97%</title></circle><circle cx="780.0" cy="96.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Accuracy on kept answers, conf >= 0.9: 100%</title></circle><text x="794.0" y="101.0" fill="#52514e" font-size="13" text-anchor="start" font-weight="400">Accuracy on kept answers</text><path d="M100.0,96.0 L270.0,129.8 L440.0,163.7 L610.0,214.5 L780.0,282.2" fill="none" stroke="#898781" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round"/><circle cx="100.0" cy="96.0" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"><title>Coverage (share kept), keep all: 100%</title></circle><circle cx="270.0" cy="129.8" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"><title>Coverage (share kept), conf >= 0.6: 92%</title></circle><circle cx="440.0" cy="163.7" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"><title>Coverage (share kept), conf >= 0.7: 85%</title></circle><circle cx="610.0" cy="214.5" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"><title>Coverage (share kept), conf >= 0.8: 73%</title></circle><circle cx="780.0" cy="282.2" r="5" fill="#898781" stroke="#fcfcfb" stroke-width="2"><title>Coverage (share kept), conf >= 0.9: 58%</title></circle><text x="794.0" y="287.2" fill="#52514e" font-size="13" text-anchor="start" font-weight="400">Coverage</text><text x="100.0" y="160.3" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="600">90%</text><text x="100.0" y="84.0" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">100%</text><text x="270.0" y="102.3" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="600">96%</text><text x="270.0" y="151.8" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">92%</text><text x="440.0" y="104.0" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="600">95%</text><text x="440.0" y="185.7" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">85%</text><text x="610.0" y="95.6" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="600">97%</text><text x="610.0" y="236.5" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">73%</text><text x="780.0" y="84.0" fill="#0b0b0b" font-size="13" text-anchor="middle" font-weight="600">100%</text><text x="780.0" y="304.2" fill="#52514e" font-size="13" text-anchor="middle" font-weight="400">58%</text></svg>
